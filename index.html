<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dilerim ki</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202020,#000);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:min(92%,760px);padding:40px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-weight:300;font-size:clamp(30px,5vw,48px);margin:0 0 25px}
#text{font-size:clamp(18px,2.8vw,28px);line-height:1.8;white-space:pre-wrap;min-height:220px}
button{margin-top:18px;padding:14px 34px;border-radius:999px;border:0;font-size:18px;background:#fff;color:#000;font-weight:600}
.cursor{animation:b 1s infinite}@keyframes b{50%{opacity:0}}
</style></head><body><div class="card"><h1>Dilerim ki</h1><div id="text"></div><button id="b">Dinlemek için tıkla</button><audio id="a"><source src="muzik.mp3" type="audio/mpeg"></audio></div><script>
const m=["Nasılsın ?.","Hayatına odaklanmalısın bırak boş insanlarla ve boş işlerle uğraşmayı artık. Zevkler her zaman yaşanır.","Bu arada beni engellemişsin sanki sana zarar vermiş düşmanınım :)","İhtiyacın olduğunda bana ulaşmayı dene.","Bilirim sende benim gibi ölsen de ulaşmazsın ama sen farklısın sen dene ben yapamasamda sen yap.","Sınavın umarım güzel geçer ve istediğin işini ve hayatı kazanırsın emeklerinle. Şayet kazanamazsan(umarım olmaz böyle birşey)ben buradayım savaşmak istersen.","Kendine iyi bak."];
const t=document.getElementById('text'),a=document.getElementById('a');
async function run(){for(let i=0;i<m.length;i++){for(let ch of m[i]){t.innerHTML+=ch+'<span class="cursor">|</span>';await new Promise(r=>setTimeout(r,40));t.innerHTML=t.innerHTML.replace(/<span class="cursor">\|<\/span>$/,'')}t.innerHTML+="\n\n";await new Promise(r=>setTimeout(r,700));}}
b.onclick=()=>{b.remove();a.play().catch(()=>{});run();}
</script></body></html>
